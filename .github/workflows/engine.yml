name: engine

# The daily lead run, free on GitHub Actions. Writes to the shared Postgres (Neon) that the Vercel
# dashboard reads. The dashboard's "Find leads now" button triggers this via workflow_dispatch.
on:
  schedule:
    - cron: "0 1 * * *"          # 01:00 UTC = 06:30 IST (keep in sync with schedule.daily_at in metalscout.cloud.yaml)
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages to run (comma separated)"
        required: false
        default: "discover,profile,signals,agents,export"

concurrency:
  group: metalscout-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing. Add your Neon connection string under Settings -> Secrets -> Actions."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-engine.txt
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-engine.txt
          python -m playwright install --with-deps chromium
      - name: Run
        # inputs reach bash only as environment variables, never interpolated into the script
        env:
          STAGES: ${{ github.event.inputs.stages || 'discover,profile,signals,agents,export' }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          if [[ ! "$STAGES" =~ ^[a-z,-]+$ ]]; then
            echo "::error::stages input may contain only a-z, comma and hyphen"
            exit 1
          fi
          python -m metalscout --config metalscout.cloud.yaml run --trigger "$TRIGGER" --stages "$STAGES"
      - name: Keep the Excel export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leads-${{ github.run_id }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 14
