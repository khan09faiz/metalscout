version: 2
updates:
  # Python dependencies: requirements*.txt (version ranges) and pyproject.toml.
  # The hashed lock files (requirements*.lock) are regenerated with uv; see the command at the top of each.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Keeps the SHA-pinned actions (and their version comments) current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
