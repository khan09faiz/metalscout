[project]
name = "metalscout"
version = "1.2.0"
description = "Find manufacturers and end users that buy raw metal (India). Deterministic daily pipeline + dashboard."
requires-python = ">=3.10"
# core = dashboard + database (also what Vercel needs); [engine] adds the browser crawler and search
dependencies = ["phonenumbers>=8.13", "tldextract>=5", "pyyaml>=6", "httpx>=0.25", "openpyxl>=3.1", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
engine = ["playwright>=1.45", "selectolax>=0.3.21", "ddgs>=9"]
sheets = ["gspread>=6"]
dev = ["pytest>=8", "setuptools>=68", "ruff>=0.6", "mypy>=1.10"]  # setuptools: the wheel-build packaging test

[project.scripts]
metalscout = "metalscout.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metalscout*"]

[tool.setuptools.package-data]
metalscout = ["web/*", "prompts/agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S"]
ignore = [
  "E501",  # long lines are the house style
  "E731",  # small named lambdas are used deliberately
  "S311",  # `random` only jitters politeness delays; nothing cryptographic
  "S603",  # flags every subprocess call; all calls pass argument lists, never a shell
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108", "S310", "S603", "S607", "S608"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["metalscout", "api"]
